services:
  - type: web
    name: edu-timetable
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health.php
    healthCheckInterval: 60
    healthCheckTimeout: 30
    healthCheckRetries: 5
    numInstances: 1
    disk:
      name: edu-timetable-output
      mountPath: /var/www/html/output
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: online
      - key: DB_DRIVER
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: FET_ENGINE_PATH
        value: /var/www/html/engine/fet-cl
      - key: OUTPUT_DIR
        value: /var/www/html/output
      - key: SSO_SHARED_SECRET
        sync: false
      - key: CENTRAL_SERVER_URL
        sync: false
