name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP syntax, Composer & clash tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (if lock present)
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          fi

      - name: PHP syntax check on all files
        run: |
          set -e
          for f in index.php login.php logout.php health.php status.php sso.php; do
            if [ -f "$f" ]; then
              php -l "$f"
            fi
          done
          for d in admin config db export tests; do
            if [ -d "$d" ]; then
              find "$d" -name '*.php' -print0 | xargs -0 -n1 php -l
            fi
          done

      - name: Run clash / pre-check unit tests
        run: php tests/ClashDetectorTest.php
